<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SUNI · Persona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<script src="/i18n.js"></script>
<script>
// Apply operator-configurable branding (Admin -> Configuration -> Identity).
// Ids are optional per page; a missing element is simply skipped.
function _applyBranding(cfg) {
  if (!cfg) return;
  const name = (cfg.display_name || '').trim();
  const tag  = (cfg.tagline || '').trim();
  ['brand-name', 'brand-name-2'].forEach(id => {
    const el = document.getElementById(id);
    if (el && name) el.textContent = name;
  });
  ['brand-tagline', 'brand-tagline-2'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = tag;
  });
  if (name) document.title = name;
}
</script>
<style>
:root {
  --gold:   #c9a227;
  --gold-b: #f0c040;
  --cyan:   #00d4ff;
  --bg:     #000000;
  --border: rgba(201,162,39,0.15);
  --text:   rgba(218,215,240,0.88);
  --dim:    rgba(170,165,210,0.42);
}
*{margin:0;padding:0;box-sizing:border-box}
/* Dropdown option list — dark theme (browser default is white/unreadable) */
select option,select optgroup{background:#111;color:var(--text)}
html,body{height:100%;overflow:hidden;background:var(--bg)}
#app{position:relative;width:100vw;height:100vh;overflow:hidden}

/* ── CANVAS (fullscreen, behind everything) ── */
#suni-canvas{
  position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;
}

/* ── HEADER ── */
header{
  position:absolute;top:0;left:0;right:0;height:48px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;z-index:20;
  background:linear-gradient(to bottom,rgba(5,5,20,.92) 0%,transparent 100%);
}
.wordmark{
  font-family:'Syne',sans-serif;font-weight:800;font-size:16px;
  letter-spacing:.38em;color:var(--gold);text-transform:uppercase;
}
.wordmark sub{
  font-size:7.5px;font-weight:400;letter-spacing:.1em;color:var(--dim);
  display:block;margin-top:2px;font-family:'DM Mono',monospace;font-style:normal;
}
.h-right{display:flex;align-items:center;gap:9px}
.mtag{
  padding:2px 6px;border:1px solid var(--border);border-radius:2px;
  font-size:8.5px;letter-spacing:.06em;color:var(--dim);font-family:'DM Mono',monospace;
}
.live-dot{
  width:6px;height:6px;border-radius:50%;background:#2ecc71;
  box-shadow:0 0 7px #2ecc71;animation:blink-dot 2.2s ease-in-out infinite;
}
@keyframes blink-dot{0%,100%{opacity:1}55%{opacity:.3}}

/* ── STATE LABEL ── */
#state-label{
  position:absolute;top:56px;left:22px;
  font-family:'Syne',sans-serif;font-size:7.5px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--dim);z-index:10;
  transition:color .4s;user-select:none;
}
#state-label.thinking{color:var(--cyan)}
#state-label.speaking{color:var(--gold)}
#state-label.working{color:#14d98c;font-size:8.5px;letter-spacing:.06em}
#state-label.browsing{color:#09bfd8;font-size:8.5px;letter-spacing:.06em}

/* ── LIVE CAPTION (what SUNI is saying) ── */
#subtitle{
  position:fixed;
  left:50%;transform:translateX(-50%) translateY(6px);
  bottom:132px;
  max-width:min(680px,90vw);width:90%;text-align:center;
  font-family:'DM Mono',monospace;font-style:italic;font-weight:300;font-size:14px;
  color:var(--gold);line-height:1.62;
  opacity:0;transition:opacity .5s ease,transform .5s ease;
  pointer-events:none;
  /* dark inner shadow keeps it legible over the bright face, gold glow for identity */
  text-shadow:0 1px 12px rgba(0,0,0,.9),0 0 30px rgba(201,162,39,.42);
  z-index:10;
}
#subtitle.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){#subtitle{transition:opacity .3s ease}}

/* ── CHAT DOCK (retractable) ── */
#chat-overlay{
  position:fixed;bottom:24px;
  left:50%;transform:translateX(-50%);
  width:min(680px,94vw);
  z-index:15;display:flex;flex-direction:column;
}

/* Grab handle — always visible; tap to expand/collapse the transcript */
#dock-handle{
  position:relative;height:19px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(6,6,22,.74);
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  border:1px solid var(--border);border-bottom:none;
  border-radius:6px 6px 0 0;
  cursor:pointer;user-select:none;transition:background .2s;
}
#dock-handle:hover{background:rgba(12,14,42,.82)}
#dock-handle:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
/* CSS chevron — points up when collapsed (pull up), down when expanded */
#dock-handle .chev{
  width:8px;height:8px;margin-top:3px;
  border-right:2px solid rgba(0,212,255,.55);
  border-bottom:2px solid rgba(0,212,255,.55);
  transform:rotate(-135deg);transition:transform .34s ease,border-color .2s;
}
#dock-handle:hover .chev{border-color:rgba(0,212,255,.85)}
#chat-overlay:not(.collapsed) #dock-handle .chev{transform:rotate(45deg);margin-top:-3px}
/* Pin — keep the panel open, immune to auto-collapse */
#dock-pin{
  position:absolute;right:7px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--dim);
  font-size:10px;line-height:1;cursor:pointer;padding:4px;opacity:.5;
  transition:opacity .2s,color .2s;
}
#dock-pin:hover{opacity:1}
#dock-pin.pinned{color:var(--cyan);opacity:1}
#dock-pin:focus-visible{outline:1px solid var(--cyan);outline-offset:1px}

#messages{
  background:rgba(6,6,22,.74);
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  border-left:1px solid var(--border);border-right:1px solid var(--border);
  max-height:240px;overflow-y:auto;
  padding:12px 13px 7px;
  display:flex;flex-direction:column;gap:11px;
  scroll-behavior:smooth;
  font-family:'DM Mono',monospace;color:var(--text);
  transition:max-height .34s cubic-bezier(.4,0,.2,1),opacity .26s ease,padding .34s ease;
}
/* Retracted (collapsed dock) OR nothing to show (empty) → transcript folds away.
   Handled in ONE place so the handle+input read as a single pill in every state. */
#chat-overlay.collapsed #messages,
#messages:empty{
  max-height:0;opacity:0;padding-top:0;padding-bottom:0;
  border-top:none;border-bottom:none;overflow:hidden;
}
@media(prefers-reduced-motion:reduce){#messages{transition:opacity .2s ease}}
#messages::-webkit-scrollbar{width:2px}
#messages::-webkit-scrollbar-track{background:transparent}
#messages::-webkit-scrollbar-thumb{background:rgba(201,162,39,.28);border-radius:2px}

.msg{max-width:100%;animation:msg-in .2s ease both}
@keyframes msg-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg-role{
  font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:3px;
  font-family:'Syne',sans-serif;
}
.msg.user .msg-role{color:var(--gold);text-align:right}
.msg.suni .msg-role{color:var(--cyan)}
.msg-body{padding:7px 10px;font-size:12px;line-height:1.65;font-weight:300;border-radius:2px}
.msg.user .msg-body{
  background:rgba(201,162,39,.05);border-left:2px solid var(--gold);
  color:rgba(228,218,186,.88);text-align:right;
}
.msg.suni .msg-body{background:rgba(0,212,255,.04);border-left:2px solid var(--cyan)}
.msg-body strong{color:var(--gold-b);font-weight:500}
.msg-body em{color:var(--cyan);font-style:italic}
.msg-body code{
  background:rgba(201,162,39,.1);border:1px solid rgba(201,162,39,.2);
  padding:1px 4px;border-radius:2px;font-size:11px;color:var(--gold-b);
}
.msg-body p{margin-bottom:5px}.msg-body p:last-child{margin-bottom:0}

.cursor{
  display:inline-block;width:5px;height:11px;background:var(--cyan);
  vertical-align:middle;margin-left:2px;animation:blink-c .75s step-end infinite;
}
@keyframes blink-c{0%,100%{opacity:1}50%{opacity:0}}

/* ── INPUT AREA ── */
#input-area{
  display:flex;gap:6px;align-items:center;padding:9px 11px;
  background:rgba(5,5,20,.9);
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  border:1px solid var(--border);border-radius:0 0 6px 6px;
}

#user-input{
  flex:1;background:rgba(255,255,255,.03);
  border:1px solid rgba(201,162,39,.11);border-radius:2px;
  padding:8px 10px;color:var(--text);
  font-family:'DM Mono',monospace;font-size:12px;font-weight:300;
  outline:none;transition:border-color .2s,box-shadow .2s;
}
#user-input:focus{border-color:rgba(201,162,39,.42);box-shadow:0 0 0 1px rgba(201,162,39,.08)}
#user-input::placeholder{color:var(--dim);font-style:italic}
#user-input:disabled{opacity:.4}

/* ── FILE UPLOAD ── */
#attach-btn{display:flex;align-items:center;justify-content:center;
  width:30px;height:30px;flex-shrink:0;cursor:pointer;
  background:rgba(255,255,255,.03);border:1px solid rgba(201,162,39,.11);
  border-radius:2px;color:var(--dim);transition:all .18s;}
#attach-btn:hover{color:var(--gold);border-color:rgba(201,162,39,.42)}
#file-chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 2px;}
#file-chips:not(:empty){margin-bottom:7px}
.file-chip{display:flex;align-items:center;gap:5px;
  background:rgba(0,212,255,.07);border:1px solid rgba(0,212,255,.2);
  border-radius:3px;padding:3px 8px;font-size:10px;color:var(--cyan);max-width:200px;
  font-family:'DM Mono',monospace;}
.file-chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.file-chip-remove{background:none;border:none;color:rgba(0,212,255,.5);
  cursor:pointer;font-size:13px;padding:0;line-height:1;flex-shrink:0;}
.file-chip-remove:hover{color:#ff5c5c}
.file-chip.uploading{opacity:.6;animation:chipPulse 1s infinite;}
@keyframes chipPulse{0%,100%{opacity:.6}50%{opacity:.9}}
#drop-overlay{position:fixed;inset:0;z-index:500;display:none;
  align-items:center;justify-content:center;
  background:rgba(0,212,255,.06);border:2px dashed rgba(0,212,255,.45);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  font-family:'DM Mono',monospace;font-size:14px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--cyan);pointer-events:none;}
#drop-overlay.active{display:flex}

#send-btn{
  background:linear-gradient(135deg,var(--gold) 0%,#896810 100%);
  border:none;border-radius:2px;padding:8px 14px;color:#05050e;
  font-family:'Syne',sans-serif;font-weight:700;font-size:10px;
  letter-spacing:.1em;cursor:pointer;text-transform:uppercase;
  transition:filter .18s,transform .1s;white-space:nowrap;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
#send-btn:hover{filter:brightness(1.2)}
#send-btn:active{transform:scale(.97)}
#send-btn:disabled{opacity:.35;cursor:not-allowed;filter:none}

#tts-btn{
  background:transparent;border:1px solid rgba(0,212,255,.18);
  border-radius:2px;padding:8px 10px;color:var(--dim);
  font-size:13px;cursor:pointer;transition:all .2s;flex-shrink:0;
}
#tts-btn.on{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 8px rgba(0,212,255,.18)}

#snap-btn{
  background:transparent;border:1px solid rgba(255,255,255,.14);
  border-radius:2px;padding:8px 10px;color:var(--dim);
  font-size:13px;cursor:pointer;transition:all .2s;flex-shrink:0;
}
#snap-btn:hover{border-color:var(--cyan);color:var(--cyan)}
#snap-btn.busy{opacity:.5;cursor:progress}

#mic-btn{
  background:transparent;border:1px solid rgba(255,255,255,.14);
  border-radius:2px;padding:8px 10px;color:var(--dim);
  font-size:13px;cursor:pointer;transition:all .2s;flex-shrink:0;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
#mic-btn.listening{
  border-color:#e74c3c;color:#e74c3c;
  box-shadow:0 0 10px rgba(231,76,60,.35);
  animation:mic-pulse .85s ease-in-out infinite;
}
#mic-btn:disabled{opacity:.25;cursor:not-allowed}
@keyframes mic-pulse{0%,100%{box-shadow:0 0 8px rgba(231,76,60,.3)}50%{box-shadow:0 0 18px rgba(231,76,60,.65)}}

@media(max-width:768px){
  #subtitle{bottom:118px;font-size:13px}
  #chat-overlay{bottom:12px;width:96vw;padding-bottom:env(safe-area-inset-bottom,0px)}
  #input-area{border-radius:0 0 6px 6px}
  #messages{max-height:150px}
}
@media(max-height:520px){
  #messages{max-height:104px}
  #chat-overlay{bottom:6px}
  /* keep the caption — it's the primary response surface now — just tuck it lower/smaller */
  #subtitle{bottom:92px;font-size:12px}
}

/* background scanlines removed — head scanlines come from the FS2 shader */
#app::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 42%,rgba(0,0,0,.5) 100%)}
/* Prompt "ingest" — words enter large (near/front) then recede & fade into the
   background, sizes + speeds randomized with variation */
#ingest-layer{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.ingest-word{position:absolute;left:0;top:0;font-family:'Syne',sans-serif;font-weight:600;
  font-size:52px;white-space:nowrap;color:rgba(255,255,255,.92);text-shadow:0 0 22px rgba(255,255,255,.3);
  will-change:transform,opacity;opacity:0;
  transform:translate(var(--x0),var(--y0)) scale(var(--s0));
  animation:recede var(--dur) cubic-bezier(.2,.7,.3,1) var(--delay) forwards}
@keyframes recede{
  0%{opacity:0;transform:translate(var(--x0),var(--y0)) scale(var(--s0))}
  15%{opacity:var(--op)}
  100%{opacity:0;transform:translate(var(--x1),var(--y1)) scale(var(--s1))}
}
/* Content stage (Step A) — appears when the head shrinks to the corner */
#content-stage{position:absolute;top:60px;left:3.5%;width:60%;bottom:118px;z-index:5;
  opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .5s ease,transform .5s ease;display:flex;flex-direction:column}
#content-stage.on{opacity:1;transform:none;pointer-events:auto}
#stage-body{flex:1;overflow-y:auto;padding:22px 26px;border-radius:10px;
  background:linear-gradient(180deg,rgba(6,10,24,.42),rgba(6,10,24,.26));
  border:1px solid rgba(0,212,255,.14);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  color:rgba(228,236,255,.94);font-family:'DM Mono',monospace;font-size:19px;line-height:1.62;font-weight:300}
#stage-media{display:flex;flex-wrap:wrap;gap:10px}
#stage-media:not(:empty){margin-bottom:16px}
#stage-media img,#stage-media video{max-height:230px;max-width:100%;border-radius:8px;border:1px solid rgba(0,212,255,.2);display:block}
#stage-media .stage-file{flex:1 1 100%}
#stage-media .sf-name{font-size:12px;color:rgba(0,212,255,.75);margin-bottom:5px;font-family:'DM Mono',monospace}
#stage-media .sf-text{max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0;
  font-size:12.5px;line-height:1.5;color:rgba(220,228,245,.85);background:rgba(0,0,0,.25);
  padding:10px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.08)}
#stage-media .sf-table{border-collapse:collapse;font-size:12px;display:block;overflow:auto;max-height:300px;max-width:100%}
#stage-media .sf-table th,#stage-media .sf-table td{border:1px solid rgba(255,255,255,.12);padding:4px 8px;text-align:left;white-space:nowrap}
#stage-media .sf-table th{color:rgba(0,212,255,.8);position:sticky;top:0;background:rgba(6,10,24,.92)}
#stage-media .stage-doc{flex:1 1 100%;width:100%;height:min(58vh,520px);border:1px solid rgba(0,212,255,.2);border-radius:8px;background:#fff}
#stage-media .stage-card{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;text-decoration:none;
  border:1px solid rgba(0,212,255,.2);border-radius:8px;color:rgba(220,228,245,.9);font-family:'DM Mono',monospace;font-size:13px}
#stage-text .tstamp,#stage-text .pg{color:#00d4ff;cursor:pointer;border-bottom:1px dashed rgba(0,212,255,.6);white-space:nowrap}
#stage-text .tstamp:hover,#stage-text .pg:hover{background:rgba(0,212,255,.12)}
#stage-media mark{background:rgba(0,212,255,.32);color:#eaf6ff;border-radius:2px;padding:0 2px;scroll-margin:60px}
#stage-media .stage-img-wrap{position:relative;display:inline-block;max-width:100%;line-height:0}
.focus-box{position:absolute;border:2px solid #00e5ff;border-radius:4px;pointer-events:none;
  box-shadow:0 0 12px rgba(0,229,255,.6),inset 0 0 12px rgba(0,229,255,.22);animation:focusPulse 1.5s ease-in-out infinite}
.focus-note{position:absolute;left:-1px;top:-20px;background:rgba(0,190,230,.94);color:#03121a;
  font-family:'DM Mono',monospace;font-size:11px;padding:1px 6px;border-radius:3px;white-space:nowrap;line-height:1.4}
@keyframes focusPulse{0%,100%{box-shadow:0 0 12px rgba(0,229,255,.6),inset 0 0 12px rgba(0,229,255,.22)}
  50%{box-shadow:0 0 22px rgba(0,229,255,.95),inset 0 0 16px rgba(0,229,255,.4)}}
#stage-text img,#stage-text video{max-width:100%;border-radius:8px;margin:8px 0;display:block}
#stage-body::-webkit-scrollbar{width:3px}
#stage-body::-webkit-scrollbar-thumb{background:rgba(0,212,255,.3);border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <canvas id="suni-canvas"></canvas>
  <div id="ingest-layer"></div>
  <div id="content-stage"><div id="stage-body"><div id="stage-media"></div><div id="stage-text"></div></div></div>
  <!-- background scanlines removed — the head keeps its own scanlines from the FS2 shader -->
  <header>
    <div class="wordmark"><span id="brand-name">SUNI</span><sub id="brand-tagline"></sub></div>
    <div class="h-right">
      <div id="header-meta"></div>
      <select id="mode-select" title="Conversation mode"
        style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
               color:rgba(255,255,255,.6);font-family:'DM Mono',monospace;font-size:9px;
               letter-spacing:.08em;padding:3px 7px;border-radius:3px;cursor:pointer;
               display:none">
        <option value="assistant">● assistant</option>
        <option value="task">◈ task</option>
        <option value="read-only">◌ read-only</option>
        <option value="collaborate">✦ collaborate</option>
      </select>
      <a href="/" title="Switch to Orb mode"
         style="padding:3px 8px;border:1px solid rgba(201,162,39,.28);border-radius:2px;
                font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;
                color:rgba(201,162,39,.6);text-decoration:none;transition:all .2s;"
         onmouseover="this.style.color='#c9a227';this.style.borderColor='rgba(201,162,39,.6)'"
         onmouseout="this.style.color='rgba(201,162,39,.6)';this.style.borderColor='rgba(201,162,39,.28)'">
        ◎ ORB
      </a>
      <a href="/chat" title="Switch to Chat mode"
         style="padding:3px 8px;border:1px solid rgba(201,162,39,.28);border-radius:2px;
                font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;
                color:rgba(201,162,39,.6);text-decoration:none;transition:all .2s;"
         onmouseover="this.style.color='#c9a227';this.style.borderColor='rgba(201,162,39,.6)'"
         onmouseout="this.style.color='rgba(201,162,39,.6)';this.style.borderColor='rgba(201,162,39,.28)'">
        ☰ CHAT
      </a>
      <button id="stage-btn" aria-pressed="false" title="Stage view — shrink the head to the corner and open a content panel"
         style="background:none;border:1px solid rgba(201,162,39,.28);border-radius:2px;
                font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;padding:3px 8px;
                color:rgba(201,162,39,.6);cursor:pointer;transition:all .2s;"
         onmouseover="if(!this.classList.contains('on')){this.style.color='#c9a227';this.style.borderColor='rgba(201,162,39,.6)'}"
         onmouseout="if(!this.classList.contains('on')){this.style.color='rgba(201,162,39,.6)';this.style.borderColor='rgba(201,162,39,.28)'}">
        ▣ STAGE
      </button>
      <button id="cam-btn" aria-pressed="false"
         title="Camera off — click to let SUNI follow your movement (stays on this device)"
         style="background:none;border:1px solid rgba(201,162,39,.28);border-radius:2px;
                font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;padding:3px 8px;
                color:rgba(201,162,39,.6);cursor:pointer;transition:all .2s;"
         onmouseover="if(!this.classList.contains('on')){this.style.color='#c9a227';this.style.borderColor='rgba(201,162,39,.6)'}"
         onmouseout="if(!this.classList.contains('on')){this.style.color='rgba(201,162,39,.6)';this.style.borderColor='rgba(201,162,39,.28)'}">
        ◉ CAM
      </button>
      <button id="orb-settings-btn" title="Language &amp; voice settings"
         style="background:none;border:1px solid rgba(201,162,39,.28);border-radius:2px;
                font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;padding:3px 8px;

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════
//  CANVAS-2D STYLIZED HEAD  —  SUNI persona (state + audio driven)
// ═══════════════════════════════════════════════════════════════════

const canvas = document.getElementById('suni-canvas');

let W = window.innerWidth, H = window.innerHeight, DPR = 1;

/* ── holographic palette (state-driven) ── */
const COL  = { idle:[70,170,225], think:[0,212,255], speak:[150,225,255], work:[40,220,150], brws:[20,200,235] };
const CORE = [225,246,255];
function lerp(a,b,t){ return a+(b-a)*t; }
function mix3(a,b,t){ return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]; }
function stateColor(ss){
  const A=[COL.idle,COL.think,COL.speak,COL.work,COL.brws];
  const i=Math.max(0,Math.min(3,Math.floor(ss)));
  return mix3(A[i],A[i+1],Math.min(1,Math.max(0,ss-i)));
}

/* ── user-chosen base colour (persisted per browser) ────────────────
   Derives the whole state palette from one hue, keeping brightness
   variation so idle/thinking/speaking still read differently. */
const COL_DEFAULT = JSON.parse(JSON.stringify(COL));   // the hand-tuned default
const FACE_COLOR_KEY = 'suni_face_color';
const FACE_COLOR_HINT = '#00d4ff';                      // picker's default swatch
function _hexToRgb(h){ const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(h||''); return m?[parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)]:[0,212,255]; }
function _clampRgb(c){ return c.map(v=>Math.max(0,Math.min(255,Math.round(v)))); }
function _scaleRgb(c,f){ return _clampRgb([c[0]*f,c[1]*f,c[2]*f]); }
function applyFaceColor(hex){
  const B=_hexToRgb(hex);
  COL.idle  = _scaleRgb(B,0.72);
  COL.think = _clampRgb(B.slice());
  COL.speak = _clampRgb(mix3(B,[255,255,255],0.45));
  COL.work  = _scaleRgb(B,0.90);
  COL.brws  = _scaleRgb(B,0.82);
}
function resetFaceColor(){ Object.assign(COL, JSON.parse(JSON.stringify(COL_DEFAULT))); }
(function(){ const saved=localStorage.getItem(FACE_COLOR_KEY); if(saved) applyFaceColor(saved); })();
{
  const _fc = document.getElementById('orb-face-color');
  const _fcReset = document.getElementById('orb-face-color-reset');
  if(_fc){
    _fc.value = localStorage.getItem(FACE_COLOR_KEY) || FACE_COLOR_HINT;
    _fc.addEventListener('input', ()=>{ applyFaceColor(_fc.value); localStorage.setItem(FACE_COLOR_KEY, _fc.value); });
  }
  if(_fcReset){
    _fcReset.addEventListener('click', ()=>{ resetFaceColor(); localStorage.removeItem(FACE_COLOR_KEY); if(_fc) _fc.value = FACE_COLOR_HINT; });
  }
}

/* ── audio RMS → jaw (analyser created later in TTS section) ── */
let _wave=null;
function audioLevel(){
  if(!analyser) return 0;
  if(!_wave||_wave.length!==analyser.fftSize) _wave=new Uint8Array(analyser.fftSize);
  try{ analyser.getByteTimeDomainData(_wave); }catch(e){ return 0; }
  let s=0; for(let i=0;i<_wave.length;i++){ const v=(_wave[i]-128)/128; s+=v*v; }
  return Math.sqrt(s/_wave.length);
}

/* ── animation state ── */
let mouthOpen=0, gazeX=0, gazeY=0, gazeTX=0, gazeTY=0, gazeRetarget=0;
let _camGaze={active:false, x:0, y:0, hold:0};   // webcam motion target (opt-in)
let _stageMode=false, _stageT=0;   // Step A: 0 = head full/centre, 1 = head shrunk to top-right + content stage

/* ── minimal mat4 (column-major) ── */
function m4ident(){ const o=new Float32Array(16); o[0]=o[5]=o[10]=o[15]=1; return o; }
function m4mul(a,b){ const o=new Float32Array(16);
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){ let s=0; for(let k=0;k<4;k++) s+=a[k*4+r]*b[c*4+k]; o[c*4+r]=s; } return o; }
function m4persp(fovy,asp,n,f){ const t=1/Math.tan(fovy/2); const o=new Float32Array(16);
  o[0]=t/asp; o[5]=t; o[10]=(f+n)/(n-f); o[11]=-1; o[14]=(2*f*n)/(n-f); return o; }
function m4trans(x,y,z){ const o=m4ident(); o[12]=x;o[13]=y;o[14]=z; return o; }
function m4scale(x,y,z){ const o=m4ident(); o[0]=x;o[5]=y;o[10]=z; return o; }
function m4rotY(a){ const c=Math.cos(a),s=Math.sin(a); const o=m4ident(); o[0]=c;o[2]=-s;o[8]=s;o[10]=c; return o; }
function m4rotX(a){ const c=Math.cos(a),s=Math.sin(a); const o=m4ident(); o[5]=c;o[6]=s;o[9]=-s;o[10]=c; return o; }

/* ── build a generic head mesh (original geometry; reference used only for style) ── */
let headPos,headJaw,headIdx,headLineCount,eyePos;
function smoothstep(a,b,x){ let t=(x-a)/(b-a); t=Math.max(0,Math.min(1,t)); return t*t*(3-2*t); }
function buildHead(){
  const NP=38, NT=42, pos=[], jw=[];
  for(let i=0;i<=NP;i++){
    const phi=(i/NP)*Math.PI;
    for(let j=0;j<=NT;j++){
      const theta=(j/NT)*Math.PI*2;
      let rx=0.70, ry=0.96, rz=0.80;
      let x=rx*Math.sin(phi)*Math.sin(theta);
      let y=ry*Math.cos(phi);
      let z=rz*Math.sin(phi)*Math.cos(theta);
      /* jaw / chin taper (lower face narrows) */
      if(y<0){ const tp=1-smoothstep(0,-0.95,y)*0.34; x*=tp; if(z>0) z*=1-smoothstep(0,-0.95,y)*0.12; }
      const front=Math.max(0,z)/rz, f2=front*front;
      /* nose: ridge brow->tip, tip bulb */
      const nBand=smoothstep(0.36,0.02,y)*smoothstep(-0.16,0.05,y);
      z += f2*nBand*Math.exp(-(x*x)/0.010)*0.34;
      z += f2*Math.exp(-((x*x)/0.014+Math.pow((y+0.02)/0.05,2)))*0.10;
      /* brow ridge */
      z += f2*Math.exp(-(Math.pow((y-0.30)/0.05,2)))*Math.exp(-(x*x)/0.18)*0.09;
      /* eye sockets (deep) + eyeball bulge */
      for(const sx of [-1,1]){
        const dx=x-sx*0.29, dy=y-0.15;
        z -= f2*Math.exp(-((dx*dx)/0.020+(dy*dy)/0.011))*0.16;
        z += f2*Math.exp(-((dx*dx)/0.006+(dy*dy)/0.004))*0.045;
      }
      /* cheekbones */
      for(const sx of [-1,1]) z += f2*Math.exp(-((x-sx*0.40)*(x-sx*0.40)/0.030+(y+0.02)*(y+0.02)/0.05))*0.05;
      /* lips: ridge + groove */
      z += f2*Math.exp(-(Math.pow((y+0.30)/0.045,2)+x*x/0.045))*0.05;
      z -= f2*Math.exp(-(Math.pow((y+0.30)/0.012,2)+x*x/0.05))*0.035;
      /* chin */
      z += f2*Math.exp(-(Math.pow((y+0.70)/0.11,2)+x*x/0.05))*0.11;
      pos.push(x,y,z);
      jw.push( smoothstep(-0.20,-0.62,y) * smoothstep(-0.05,0.5,z) );
    }
  }
  const idx=[], cols=NT+1;
  for(let i=0;i<=NP;i++) for(let j=0;j<=NT;j++){
    const a=i*cols+j;
    if(j<NT) idx.push(a,a+1);
    if(i<NP) idx.push(a,a+cols);
  }
  headPos=new Float32Array(pos); headJaw=new Float32Array(jw);
  headIdx=new Uint16Array(idx); headLineCount=idx.length;
  eyePos=new Float32Array([-0.29,0.15,0.72, 0.29,0.15,0.72]);
}

/* ── WebGL setup ── */
const VS=`attribute vec3 a_pos; attribute float a_jaw;
uniform mat4 u_mvp; uniform float u_jaw,u_hingeY,u_hingeZ,u_point;
varying float v_depth;
void main(){
  vec3 p=a_pos; float ja=u_jaw*a_jaw;
  vec3 piv=vec3(0.0,u_hingeY,u_hingeZ); vec3 r=p-piv;
  float c=cos(ja), s=sin(ja);
  r=vec3(r.x, c*r.y - s*r.z, s*r.y + c*r.z);
  p=piv+r;
  vec4 mp=u_mvp*vec4(p,1.0);
  gl_Position=mp; v_depth=mp.z/mp.w; gl_PointSize=u_point;
}`;
const FS=`precision mediump float;
uniform vec3 u_color; uniform float u_bright, u_round;
varying float v_depth;
void main(){
  float f=smoothstep(1.0,-1.0,v_depth);
  float a=mix(0.14,1.0,f)*u_bright;
  if(u_round>0.5){ vec2 d=gl_PointCoord-vec2(0.5); float r=length(d); if(r>0.5) discard; float ring=smoothstep(0.5,0.33,r)*smoothstep(0.13,0.25,r); float core=smoothstep(0.10,0.0,r); a*=max(ring,core); }
  gl_FragColor=vec4(u_color*(0.55+0.45*f), a);
}`;

let gl,prog,aPos,aJaw,uMVP,uJaw,uHY,uHZ,uCol,uBri,uPt,uRound;
let bPos,bJaw,bIdx,bEye,glReady=false;
let glLost=false;

/* WebGL context loss.
   On a machine where the GPU is shared with the model backend, loading a 7B
   model can cost the browser its WebGL context. Nothing handled that: every
   buffer, texture and program silently became invalid while the render loop
   kept drawing, leaving a partial head — typically wireframe only, because
   that is the last geometry still bound.
   preventDefault() on the lost event is what makes a restore possible at all;
   without it the browser never fires webglcontextrestored. Re-initialising
   piecemeal is not realistic here (the mesh, background and eye programs are
   built by separate one-shot loaders), so a restore reloads the page — which
   is correct by construction rather than nearly correct. */
canvas.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  glLost = true; glReady = false; solidReady = false;
  console.warn('WebGL context lost — pausing render until it is restored');
}, false);
canvas.addEventListener('webglcontextrestored', () => {
  console.warn('WebGL context restored — reloading to rebuild GPU resources');
  location.reload();
}, false);

try{
  gl=canvas.getContext('webgl')||canvas.getContext('experimental-webgl');
  if(gl){
    const mk=(ty,src)=>{ const s=gl.createShader(ty); gl.shaderSource(s,src); gl.compileShader(s);
      if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    prog=gl.createProgram();
    gl.attachShader(prog,mk(gl.VERTEX_SHADER,VS)); gl.attachShader(prog,mk(gl.FRAGMENT_SHADER,FS));
    gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    aPos=gl.getAttribLocation(prog,'a_pos'); aJaw=gl.getAttribLocation(prog,'a_jaw');
    uMVP=gl.getUniformLocation(prog,'u_mvp'); uJaw=gl.getUniformLocation(prog,'u_jaw');
    uHY=gl.getUniformLocation(prog,'u_hingeY'); uHZ=gl.getUniformLocation(prog,'u_hingeZ');
    uCol=gl.getUniformLocation(prog,'u_color'); uBri=gl.getUniformLocation(prog,'u_bright');
    uPt=gl.getUniformLocation(prog,'u_point'); uRound=gl.getUniformLocation(prog,'u_round');
    buildHead();
    bPos=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,bPos); gl.bufferData(gl.ARRAY_BUFFER,headPos,gl.STATIC_DRAW);
    bJaw=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,bJaw); gl.bufferData(gl.ARRAY_BUFFER,headJaw,gl.STATIC_DRAW);
    bIdx=gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bIdx); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,headIdx,gl.STATIC_DRAW);
    bEye=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,bEye); gl.bufferData(gl.ARRAY_BUFFER,eyePos,gl.STATIC_DRAW);
    gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
    glReady=true;
  }
}catch(e){ console.warn('WebGL head init failed:',e); }

/* ── user head mesh (OBJ) → wireframe; overrides the procedural head ── */
const MODEL_YAW = 0.0;   /* set to Math.PI if the mesh faces away from camera */
let modelReady=false, modelEyes=false, solidReady=false, mode='solid', mCount=0, sCount=0;
let extU32=null, sIdxType=0;
let bmPos=null, bmJaw=null, bsPos=null, bsNrm=null, bsJaw=null, bsIdx=null;
const EXCLUDE = {'Group16029':1,'Group64944':1};   /* dense eyeball geometry (wireframe only) */

/* ── lit shader program for solid mode ── */
const VS2=`attribute vec3 a_pos; attribute vec3 a_nrm; attribute float a_jaw;
uniform mat4 u_mvp,u_model; uniform float u_jaw,u_hingeY,u_hingeZ;
varying vec3 v_n;

    if(c0===118 && c1===32){ const p=ln.split(/\s+/); V.push([+p[1],+p[2],+p[3]]); }
    else if(c0===103 && c1===32){ cur=ln.trim().slice(2); }

      const excl=!!EXCLUDE[cur]||/eye/i.test(cur||'');

      for(let k=1;k<=n;k++){ let a=parseInt(p[k],10); if(!a) continue; a=(a<0?V.length+a:a-1); if(a>=0&&a<V.length) ids.push(a); }

        const a=ids[k], b=ids[(k+1)%ids.length];

  const cen=[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2];
  const scl=1.7/Math.max(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2],1e-6);
  const NN=v=>[(v[0]-cen[0])*scl,(v[1]-cen[1])*scl,(v[2]-cen[2])*scl];

    gazeTX=_camGaze.x; gazeTY=_camGaze.y; gazeRetarget=0;

    gazeRetarget-=dt;

      gazeTX=(Math.random()*2-1)*rng; gazeTY=(Math.random()*2-1)*rng;
      gazeRetarget=(state==='thinking')?0.6+Math.random():2+Math.random()*3; }

  const jaw=mouthOpen*0.34;

  // Aspect is preserved (same shrink on W and H) so the head never distorts.

    const mx = canvas.width * 0.015, my = canvas.height * 0.06;   // larger top margin — head sits lower from the top edge

  _overlay.classList.remove('collapsed');
  _dockHandle.setAttribute('aria-expanded', 'true');
  _armDockIdle();

  if (_dockPinned) return;
  _overlay.classList.add('collapsed');
  _dockHandle.setAttribute('aria-expanded', 'false');
  clearTimeout(_dockIdleT);

  clearTimeout(_dockIdleT);

    if (!_dockPinned && state !== 'speaking') collapseDock();

// ── Animation loop ───────────────────────────────────────────────────
let lastTs = 0, T = 0;
function frame(ts) {
  // While the context is lost every GL object is invalid; keep the loop alive
  // so the page recovers on restore, but draw nothing with dead buffers.
  if (glLost) { lastTs = ts; requestAnimationFrame(frame); return; }
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts; T += dt;

  const tgt = STATE_TARGET[state] ?? 0;
  const rate = 4.5 * dt;
  stateSmooth += (tgt - stateSmooth) * Math.min(rate * 3, 1);

  renderHead(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(ts => { lastTs = ts; requestAnimationFrame(frame); });

let audioCtx = null, analyser = null;
function setupAudio(el) {
  if (audioCtx) return;
  try {
    audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
    analyser  = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    const src = audioCtx.createMediaElementSource(el);
    src.connect(analyser);
    analyser.connect(audioCtx.destination);
  } catch(e) {}
}

// Fetch synthesized audio for one clip → object URL (or null on failure).
async function _fetchTts(text) {
  try {
    const res = await _apiFetch('/api/tts', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({text, voice: window._suniTtsVoice || ''})
    });
    if (!res.ok) throw new Error('tts fail');
    return URL.createObjectURL(await res.blob());
  } catch(e) { console.warn('TTS:', e); return null; }
}

// Play one pre-fetched clip; the caption is bound here (not at fetch) so it
// tracks the audio that's actually sounding.
async function _playUrl(url, text) {
  try {
    setupAudio(audioEl);
    if (audioCtx?.state === 'suspended') await audioCtx.resume();
    audioEl.src = url;
    setState('speaking'); showSub(text);
    await audioEl.play();
    // Resolve on natural end/error OR on interrupt: send() calls _ttsResolve()
    // after pausing, since pause() fires no event this await would otherwise see
    // — without it a re-send mid-speech would park here forever and wedge TTS.
    await new Promise(r => { _ttsResolve = r; audioEl.onended = r; audioEl.onerror = r; });
  } catch(e) { console.warn('TTS:', e); }
  finally { _ttsResolve = null; if (audioEl.src.startsWith('blob:')) URL.revokeObjectURL(audioEl.src); }
}

function showSub(text) {
  clearTimeout(_capHideT);
  // Stage mode: the content panel is the display — render the reply there (rich
  // markdown) and skip the floating caption over the face.
  if (_stageMode && _stageText){
    if (text && text.trim()){ _stageText.innerHTML = md(text); _stageBody.scrollTop = _stageBody.scrollHeight; }
    return;
  }
  const clean = text
    .replace(/\*{1,2}([^*]+)\*{1,2}/g,'$1')
    .replace(/`([^`]+)`/g,'$1')
    .replace(/#{1,6}\s+/g,'')
    .replace(/\n+/g,' ').trim().slice(0, 600);   // wraps freely now — no CSS clamp
  if (!clean) return;
  subEl.textContent = clean;
  subEl.classList.add('show');
}
function hideSub() { clearTimeout(_capHideT); subEl.classList.remove('show'); }
// When TTS is off there's no audio 'ended' to key off — fade the caption on a
// timer scaled to how much there is to read.
function scheduleCaptionHide(len) {
  clearTimeout(_capHideT);
  _capHideT = setTimeout(hideSub, Math.min(3200 + (len || 0) * 22, 9000));
}

// ═══════════════════════════════════════════════════════════════════
//  MARKDOWN (minimal)
// ═══════════════════════════════════════════════════════════════════
function md(raw) {
  raw = _parseFocus(raw || '').clean;   // never show ```suni-focus``` directive blocks to the user
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc(raw)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .split(/\n{2,}/)
    .map(p => `<p>${p.replace(/\n/g,'<br>')}</p>`)
    .join('');
}

  body.className = 'msg-body';

  if (streaming) {
    const cur = document.createElement('span');
    cur.className = 'cursor';
    body.appendChild(cur);
    wrap._cur = cur; wrap._raw = '';
  } else {
    body.innerHTML = md(text);
  }
  wrap._body = body;
  wrap.appendChild(lbl); wrap.appendChild(body);
  msgsEl.appendChild(wrap);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return wrap;
}

function appendTok(wrap, tok) {
  wrap._raw += tok;
  wrap._body.innerHTML = md(wrap._raw);
  if (wrap._cur) wrap._body.appendChild(wrap._cur);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function finalMsg(wrap, full) {
  wrap._body.innerHTML = md(full);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

// ── Streaming TTS queue — speak sentence-by-sentence as they arrive ──
const _ttsQueue = [];
let _ttsBusy = false, _ttsGen = 0, _ttsFirst = true, _ttsResolve = null, _waitDrainTimer = null;

async function _drainTts() {
  if (_ttsBusy) return;
  _ttsBusy = true;
  const myGen = _ttsGen;
  // Pipeline: fetch the next clip while the current one plays so network latency
  // overlaps playback. A new send() bumps _ttsGen; this loop then bails so it
  // never fights a fresh one over the single <audio> element.
  let curText = null, curFetch = null;
  if (_ttsQueue.length) { curText = _ttsQueue.shift(); curFetch = _fetchTts(curText); }
  while (curFetch && _ttsGen === myGen) {
    const url = await curFetch, text = curText;
    if (_ttsGen === myGen && _ttsQueue.length) { curText = _ttsQueue.shift(); curFetch = _fetchTts(curText); }
    else { curText = null; curFetch = null; }
    if (url && _ttsGen === myGen) await _playUrl(url, text);
    else if (url) URL.revokeObjectURL(url);
  }
  _ttsBusy = false;
  // The queue can empty transiently mid-reply (we drain faster than the model
  // generates) — do NOT go idle here or the state/caption would flicker. The
  // send() done-handler's waitDrain owns the final idle once streaming ends.
  if (_ttsQueue.length) _drainTts();   // items enqueued as we wound down
}

function _enqueueSentence(s) {
  if (s.trim().length < 4) return;
  _ttsQueue.push(s);
  _drainTts();
}

// Emit each complete sentence in `buf` to voice (TTS on) or straight to the
// caption (muted). Returns the trailing incomplete remainder. `onEmit` fires
// once per surfaced sentence (used to mark that the reply reached the face).
function _emitSentences(buf, onEmit) {
  const re = /[^.!?]*[.!?]+(?:\s+|$)/g;
  let m, last = 0;
  while ((m = re.exec(buf)) !== null) {
    _ttsFirst = false;
    if (ttsOn) _enqueueSentence(m[0]);
    else       showSub(m[0].trim());
    if (onEmit) onEmit();
    last = m.index + m[0].length;
  }
  let rest = buf.slice(last);
  // Voice only: get the first fragment out fast instead of waiting for a full
  // stop, so speech starts sooner. Captions stay sentence-based (not split).
  if (ttsOn && _ttsFirst) {
    const clause = rest.search(/[,;:]\s/);
    if (clause >= 12) { _ttsFirst = false; _enqueueSentence(rest.slice(0, clause + 1)); if (onEmit) onEmit(); return rest.slice(clause + 2); }
    if (rest.length >= 50) {
      const sp = rest.lastIndexOf(' ');
      if (sp >= 24) { _ttsFirst = false; _enqueueSentence(rest.slice(0, sp)); if (onEmit) onEmit(); return rest.slice(sp + 1); }
    }
  }
  // Voice only: break a very long running sentence at its last clause.
  if (ttsOn && rest.length >= 90) {
    const idx = Math.max(rest.lastIndexOf(', '), rest.lastIndexOf('; '), rest.lastIndexOf(': '));
    if (idx > 20) { _enqueueSentence(rest.slice(0, idx + 1)); if (onEmit) onEmit(); return rest.slice(idx + 2); }
  }
  return rest; // remainder (incomplete sentence)
}

// ═══════════════════════════════════════════════════════════════════
//  WEBCAM MOTION TRACKING  (opt-in; frames NEVER leave the browser)
//  Samples the camera to a tiny in-page canvas, finds where movement is,
//  and steers the shared gaze target so the head + eyes follow you.
// ═══════════════════════════════════════════════════════════════════
const _camBtn    = document.getElementById('cam-btn');
const _camVideo  = document.getElementById('cam-video');
const _camCanvas = document.getElementById('cam-canvas');
const _camCtx    = _camCanvas.getContext('2d', { willReadFrequently: true });
let _camStream = null, _camTimer = null, _camPrev = null;

// Tunable feel. Flip signX/signY if the head tracks the wrong way for your camera.
// signX/signY confirmed correct (2026-07-24); gainY raised so vertical still
// reads for a seated user, whose head barely moves up/down.
const CAM = { W:64, H:48, fps:15, thresh:22, minPix:14,
              gainX:1.25, gainY:1.4, signX:-1, signY:-1, ease:0.4, decay:0.045 };

function _setCamBtn(on){
  _camBtn.classList.toggle('on', on);
  _camBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  _camBtn.style.color       = on ? '#00d4ff' : 'rgba(201,162,39,.6)';
  _camBtn.style.borderColor = on ? 'rgba(0,212,255,.6)' : 'rgba(201,162,39,.28)';
  _camBtn.style.boxShadow   = on ? '0 0 8px rgba(0,212,255,.35)' : 'none';
  _camBtn.title = on
    ? 'Camera on — SUNI follows your movement (stays on this device). Click to turn off.'
    : 'Camera off — click to let SUNI follow your movement (stays on this device)';
}

async function _camStart(){
  if(!navigator.mediaDevices?.getUserMedia){ showSub('CAMERA UNSUPPORTED'); return; }
  try{
    _camStream = await navigator.mediaDevices.getUserMedia({ video:{ width:{ideal:320}, height:{ideal:240} }, audio:false });
  }catch(e){ console.warn('camera:', e); showSub('CAMERA UNAVAILABLE'); _setCamBtn(false); return; }
  _camVideo.srcObject = _camStream;
  try { await _camVideo.play(); } catch {}
  _camPrev = null; _setCamBtn(true);
  _camTimer = setInterval(_camTick, Math.round(1000/CAM.fps));
}

function _camStop(){
  clearInterval(_camTimer); _camTimer = null;
  if(_camStream){ _camStream.getTracks().forEach(t=>t.stop()); _camStream = null; }
  _camVideo.srcObject = null;
  _camGaze.active = false; _camGaze.hold = 0; _camPrev = null;
  _setCamBtn(false);
}

function _camTick(){
  if(!_camVideo.videoWidth) return;
  _camCtx.drawImage(_camVideo, 0, 0, CAM.W, CAM.H);
  let px;
  try { px = _camCtx.getImageData(0,0,CAM.W,CAM.H).data; } catch { return; }
  const n = CAM.W*CAM.H, cur = new Uint8Array(n);
  for(let i=0,j=0;i<n;i++,j+=4){ cur[i] = (px[j]*0.3 + px[j+1]*0.59 + px[j+2]*0.11)|0; }
  if(_camPrev){
    let sx=0, sy=0, cnt=0;
    for(let y=0,i=0;y<CAM.H;y++) for(let x=0;x<CAM.W;x++,i++){
      if(Math.abs(cur[i]-_camPrev[i]) > CAM.thresh){ sx+=x; sy+=y; cnt++; }
    }
    if(cnt > CAM.minPix){
      const cx = sx/cnt/CAM.W, cy = sy/cnt/CAM.H;               // motion centroid, 0..1
      const tx = Math.max(-1,Math.min(1,(cx-0.5)*2*CAM.gainX*CAM.signX));
      const ty = Math.max(-1,Math.min(1,(cy-0.5)*2*CAM.gainY*CAM.signY));
      _camGaze.x += (tx - _camGaze.x) * CAM.ease;
      _camGaze.y += (ty - _camGaze.y) * CAM.ease;
      _camGaze.active = true; _camGaze.hold = 1;                // fresh fix
    } else if(_camGaze.active){
      _camGaze.hold -= CAM.decay;                              // no motion → relax to idle saccades
      if(_camGaze.hold <= 0) _camGaze.active = false;
    }
  }
  _camPrev = cur;
}

_camBtn.addEventListener('click', () => { if(_camStream) _camStop(); else _camStart(); });

// ── Content stage toggle (Step A) — head to corner + content panel ────
const _stageBtn  = document.getElementById('stage-btn');
const _stageEl   = document.getElementById('content-stage');

// Render attached files into the stage by type (Step D). Free-win tier:
// image · video · audio · PDF (iframe) · text/code/csv (fetched) · else a card.
const _EXT = {
  img: /\.(jpe?g|png|gif|webp|bmp|avif|svg)$/i,
  vid: /\.(mp4|webm|mov|m4v|ogv)$/i,
  aud: /\.(mp3|wav|ogg|oga|m4a|flac|aac)$/i,
  pdf: /\.pdf$/i,
  csv: /\.(csv|tsv)$/i,
  txt: /\.(txt|md|markdown|json|log|xml|ya?ml|ini|conf|cfg|js|ts|py|css|html?|sql|sh|c|cpp|h|java|go|rs)$/i,
  office: /\.(docx?|xlsx?|pptx?|odt|ods|odp)$/i,
};
function _officeCard(url, n, name){
  const xls = /\.(xlsx?|ods)$/i.test(name), ppt = /\.(pptx?|odp)$/i.test(name);
  const icon = xls ? '▦' : ppt ? '◈' : '▤';
  const kind = xls ? 'spreadsheet' : ppt ? 'presentation' : 'document';
  return `<a class="stage-card" href="${url}" target="_blank" rel="noopener"
      style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 18px;text-decoration:none">
      <span style="font-size:34px;line-height:1">${icon}</span>
      <span style="font-weight:600">${n}</span>
      <span style="font-size:11px;color:rgba(255,255,255,.5)">${kind} · open ↗</span></a>`;
}
function _serveUrl(f){
  const tok = _ST ? '&token=' + encodeURIComponent(_ST) : '';
  return `/api/files/serve?path=${encodeURIComponent(f.path)}${tok}`;
}
// Remove /api/files/serve URLs from text that gets SPOKEN or CAPTIONED — the file
// is shown on the stage instead, so SUNI shouldn't read the path/URL aloud.
function _stripServeUrls(t){
  return (t||'').replace(/\/api\/files\/serve\?\S*/g, '').replace(/\n{2,}\s*$/, '').replace(/[ \t]+$/,'');
}
// Extract media/files SUNI generated in a reply (serve links) so the stage can
// auto-open to show them — the reply-side counterpart of upload auto-staging.
function _replyMediaItems(text){
  const items = [], seen = new Set();
  const re = /\/api\/files\/serve\?path=([^)\s"'&]+)/g;
  let m;
  while ((m = re.exec(text || ''))){
    let p; try { p = decodeURIComponent(m[1]); } catch { p = m[1]; }
    if (seen.has(p)) continue; seen.add(p);
    items.push({ path: p, filename: p.split(/[\\/]/).pop() });
  }
  return items;
}
function _stageShowFiles(files){
  if (!_stageMedia || !files || !files.length) return;
  _stageMedia.innerHTML = files.map(f => {
    const url = _serveUrl(f), n = _escFile(f.filename || ''), name = f.filename || '';
    if (_EXT.img.test(name)) return `<div class="stage-img-wrap" data-file="${n}"><img src="${url}" alt="${n}"></div>`;
    if (_EXT.vid.test(name)) return `<video src="${url}" controls preload="metadata"></video>`;
    if (_EXT.aud.test(name)) return `<div class="stage-file"><div class="sf-name">🔊 ${n}</div><audio src="${url}" controls></audio></div>`;
    if (_EXT.pdf.test(name)) return `<iframe class="stage-doc" src="${url}" title="${n}"></iframe>`;
    if (_EXT.csv.test(name) || _EXT.txt.test(name))
      return `<div class="stage-file"><div class="sf-name">▤ ${n}</div><pre class="sf-text" data-src="${url}" data-csv="${_EXT.csv.test(name)?1:0}">Loading…</pre></div>`;
    if (_EXT.office.test(name)) return _officeCard(url, n, name);
    return `<a class="stage-card" href="${url}" target="_blank" rel="noopener">▤ ${n}</a>`;
  }).join('');
  _stageMedia.querySelectorAll('.sf-text[data-src]').forEach(_loadStageText);
}
async function _loadStageText(pre){
  try{
    const r = await _apiFetch(pre.dataset.src);
    if(!r.ok) throw 0;
    const t = await r.text();
    if (pre.dataset.csv === '1'){
      const rows = t.trim().split(/\r?\n/).slice(0, 200).map(r => r.split(/[,\t]/));
      pre.outerHTML = '<table class="sf-table">' + rows.map((row,i) =>
        '<tr>' + row.map(c => `<${i?'td':'th'}>${_escFile(c)}</${i?'td':'th'}>`).join('') + '</tr>').join('') + '</table>';
    } else {
      pre.textContent = t.slice(0, 20000);
    }
  }catch(e){ pre.textContent = '(could not load)'; }
}
// Make a completed staged reply interactive from SUNI's natural prose: timestamps
// seek the media, quoted phrases highlight in the shown file, "page N" jumps a
// PDF. Heuristic — no special output protocol required from the model.
function _enhanceStage(fullText){
  if (!_stageMode || !_stageText) return;
  const { clean, directives } = _parseFocus(fullText);
  let html = md(clean || '');
  html = html.replace(/\b(\d{1,2}):([0-5]\d)(?::([0-5]\d))?\b/g, (m,a,b,c) => {
    const t = (c!==undefined) ? (+a*3600 + +b*60 + +c) : (+a*60 + +b);
    return `<a class="tstamp" data-t="${t}">${m}</a>`;
  });
  html = html.replace(/\b(pages?|p\.|páginas?|pág\.)\s*(\d{1,4})\b/gi, (m,_w,n) => `<a class="pg" data-p="${n}">${m}</a>`);
  _stageText.innerHTML = html;
  _applyFocus(directives);   // draw region boxes on images (Claude-Code vision, no VLM needed)
  const quotes = [...(clean.match(/["“]([^"”\n]{4,120})["”]/g) || [])].map(q => q.replace(/^["“]|["”]$/g,'').trim());
  if (quotes.length){
    _stageMedia.querySelectorAll('.sf-text, .sf-table').forEach(el => {
      let h = el.innerHTML;
      quotes.forEach(q => {
        const re = new RegExp('(?![^<]*>)(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'i');
        h = h.replace(re, '<mark>$1</mark>');
      });
      el.innerHTML = h;
    });
    const fm = _stageMedia.querySelector('mark');
    if (fm) fm.scrollIntoView({ block:'center', behavior:'smooth' });
  }
  _stageText.querySelectorAll('.tstamp').forEach(a => a.addEventListener('click', () => {
    const media = _stageMedia.querySelector('video, audio');
    if (media){ try{ media.currentTime = +a.dataset.t; if(media.play) media.play(); }catch(e){} media.scrollIntoView({ block:'center', behavior:'smooth' }); }
  }));
  _stageText.querySelectorAll('.pg').forEach(a => a.addEventListener('click', () => {
    const doc = _stageMedia.querySelector('.stage-doc');
    if (doc){ doc.src = doc.src.split('#')[0] + '#page=' + a.dataset.p; }
  }));
}
// Parse SUNI's ```suni-focus``` directives out of a reply; returns the reply
// without them + the parsed list. She emits these to point at image regions.
function _parseFocus(text){
  const directives = [];
  // Tolerant of the fence the model actually emits (2, 3, or no backticks): key on
  // the `suni-focus` marker and grab the JSON object that follows.
  const clean = (text || '').replace(/`{0,4}\s*suni-focus\s*`{0,4}\s*(\{[\s\S]*?\})\s*`{0,4}/gi, (m, json) => {
    try{ const o = JSON.parse(json); if(o) directives.push(o); }catch(e){}
    return '';
  });
  return { clean, directives };
}
function _focusImageWrap(target){
  const wraps = [..._stageMedia.querySelectorAll('.stage-img-wrap')];
  if (!wraps.length) return null;
  if (typeof target === 'number') return wraps[target-1] || null;
  if (/^\d+$/.test(String(target||''))) return wraps[+target-1] || null;
  const t = String(target||'').toLowerCase();
  return wraps.find(w => (w.dataset.file||'').toLowerCase().includes(t)) || wraps[0];
}
function _applyFocus(directives){
  if (!directives || !directives.length) return;
  directives.forEach(d => {
    if (!d || !Array.isArray(d.box) || d.box.length < 4) return;
    const wrap = _focusImageWrap(d.target);
    if (!wrap) return;
    const [x,y,w,h] = d.box.map(Number);
    const box = document.createElement('div');
    box.className = 'focus-box';
    box.style.left   = (Math.max(0,Math.min(1,x))*100) + '%';
    box.style.top    = (Math.max(0,Math.min(1,y))*100) + '%';
    box.style.width  = (Math.max(0,Math.min(1,w))*100) + '%';
    box.style.height = (Math.max(0,Math.min(1,h))*100) + '%';
    if (d.note){ const lbl=document.createElement('span'); lbl.className='focus-note'; lbl.textContent=d.note; box.appendChild(lbl); }
    wrap.appendChild(box);
    wrap.scrollIntoView({ block:'center', behavior:'smooth' });
  });
}
_stageBtn.addEventListener('click', () => _setStage(!_stageMode));

function _armStageClose(){

}

['mousemove','wheel','click','keydown'].forEach(ev =>

// ── Vision snapshot ──────────────────────────────────────────────────
// Capture a still and attach it (reuses the upload → file_ids flow) so you can
// ask SUNI about what the camera sees. Needs a configured VLM — or Claude Code,
// which can read the saved image file — to actually interpret it. If tracking
// isn't already running, the camera is acquired just for the shot and released.
const _snapBtn = document.getElementById('snap-btn');
async function _snapshot(){
  if(_snapBtn.classList.contains('busy')) return;
  _snapBtn.classList.add('busy');
  let temp = null;
  try {
    if(!_camVideo.videoWidth){
      if(!navigator.mediaDevices?.getUserMedia){ showSub('CAMERA UNSUPPORTED'); return; }
      try { temp = await navigator.mediaDevices.getUserMedia({ video:{ width:{ideal:1280}, height:{ideal:720} }, audio:false }); }
      catch(e){ console.warn('camera:', e); showSub('CAMERA UNAVAILABLE'); return; }
      _camVideo.srcObject = temp; try { await _camVideo.play(); } catch {}
      await new Promise(r => setTimeout(r, 350));   // let exposure settle
    }
    const w = _camVideo.videoWidth||640, h = _camVideo.videoHeight||480;
    const cnv = document.createElement('canvas'); cnv.width = w; cnv.height = h;
    cnv.getContext('2d').drawImage(_camVideo, 0, 0, w, h);
    const blob = await new Promise(res => cnv.toBlob(res, 'image/jpeg', 0.85));
    if(!blob){ showSub('SNAPSHOT FAILED'); return; }
    const file = new File([blob], `snapshot-${Date.now()}.jpg`, { type:'image/jpeg' });
    expandDock();
    await _uploadFile(file);
    showSub('Snapshot attached — ask me about it.');
    inputEl.focus();
  } finally {
    if(temp){ temp.getTracks().forEach(t=>t.stop()); _camVideo.srcObject = _camStream || null; }
    _snapBtn.classList.remove('busy');
  }
}
_snapBtn?.addEventListener('click', _snapshot);

//  FILE UPLOAD  (attach button + drag-and-drop)
// ═══════════════════════════════════════════════════════════════════
const _escFile = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let _attachedFiles = [];   // [{file_id, filename, path}]

// ── File-processing status words (Step C) — reuse the ingest recede animation
// to show the pipeline as SUNI takes in a file, in the selected language. ──
const _FILE_STATUS = {
  en: { uploading:'uploading',  acquiring:'acquiring information', analyzing:'analyzing' },
  pt: { uploading:'a carregar', acquiring:'a adquirir informação', analyzing:'a analisar' },
};
function _fileStatus(key){
  const lang = (typeof getLang === 'function' ? getLang() : 'en');
  const phrase = (_FILE_STATUS[lang] || _FILE_STATUS.en)[key];
  if (phrase) _ingestPrompt(phrase);
}

async function _uploadFile(file) {
  const chip = _addFileChip(file.name, null);
  chip.classList.add('uploading');
  _fileStatus('uploading');
  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await _apiFetch('/api/files/upload', { method: 'POST', body: fd });
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || 'Upload failed'); }
    const d = await res.json();
    chip.classList.remove('uploading');
    chip.dataset.fileId = d.file_id;
    _attachedFiles.push({ file_id: d.file_id, filename: d.filename, path: d.path });
    _fileStatus('acquiring');
    setTimeout(() => _fileStatus('analyzing'), 1300);
    return d;
  } catch (e) {
    chip.remove();
    showSub('UPLOAD FAILED: ' + e.message);
    return null;
  }
}

function _addFileChip(name, fileId) {
  const chip = document.createElement('div');
  chip.className = 'file-chip';
  chip.dataset.fileId = fileId || '';
  chip.innerHTML = `<span class="file-chip-name" title="${_escFile(name)}">${_escFile(name)}</span>`
    + `<button class="file-chip-remove" title="Remove">×</button>`;
  chip.querySelector('.file-chip-remove').addEventListener('click', () => {
    if (chip.dataset.fileId) _attachedFiles = _attachedFiles.filter(f => f.file_id !== chip.dataset.fileId);
    chip.remove();
  });
  document.getElementById('file-chips').appendChild(chip);
  return chip;
}

function _clearFileChips() {
  document.getElementById('file-chips').innerHTML = '';
  _attachedFiles = [];
}

document.getElementById('file-input').addEventListener('change', async e => {
  for (const f of Array.from(e.target.files)) await _uploadFile(f);

// Drag-and-drop anywhere over the face; expand the dock so chips are visible

});
window.addEventListener('drop', async e => {
  _dropOverlay.classList.remove('active');
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault();
  expandDock();
  for (const f of Array.from(e.dataTransfer.files)) await _uploadFile(f);
  inputEl.focus();
});

// Prompt "ingest" (Step B) — scatter the prompt's words in the space, then draw
// them up and into SUNI as she starts to think. Ambient: low opacity, no input
// capture. cx/cy is the head's screen position (updated when the head relocates).
function _ingestPrompt(text){
  const layer = document.getElementById('ingest-layer');
  if (!layer || !text) return;
  const words = text.split(/\s+/).filter(Boolean).slice(0, 24);
  const W = window.innerWidth, H = window.innerHeight;
  const cx = _stageMode ? W * 0.82 : W * 0.5;         // recede toward the head (top-right when staged)
  const cy = _stageMode ? H * 0.20 : H * 0.5;
  for (let i = 0; i < words.length; i++){
    const el = document.createElement('span');
    el.className = 'ingest-word';
    el.textContent = words[i];
    const x0 = 40 + Math.random() * (W - 80);
    const y0 = 40 + Math.random() * (H - 80);          // spread across the space
    const f  = 0.12 + Math.random() * 0.22;            // slight recede only — keep words spread out
    el.style.setProperty('--x0', x0.toFixed(0) + 'px');
    el.style.setProperty('--y0', y0.toFixed(0) + 'px');
    el.style.setProperty('--x1', (x0 + (cx - x0) * f).toFixed(0) + 'px');
    el.style.setProperty('--y1', (y0 + (cy - y0) * f).toFixed(0) + 'px');
    el.style.setProperty('--s0',  (1.7 + Math.random() * 2.2).toFixed(2));   // big — near / front
    el.style.setProperty('--s1',  (0.22 + Math.random() * 0.30).toFixed(2)); // small — far / back
    el.style.setProperty('--dur', (2.4 + Math.random() * 2.4).toFixed(2) + 's');   // slower
    el.style.setProperty('--delay',(i * 0.06 + Math.random() * 0.35).toFixed(2) + 's');
    el.style.setProperty('--op',  (0.30 + Math.random() * 0.40).toFixed(2)); // transparent white
    el.addEventListener('animationend', () => el.remove());
    layer.appendChild(el);
  }
}

async function send() {
  const text = inputEl.value.trim();
  const fileIds = _attachedFiles.map(f => f.file_id);
  if ((!text && !fileIds.length) || sendBtn.disabled) return;
  const displayText = text || `[${_attachedFiles.map(f => f.filename).join(', ')}]`;
  const _sentFiles = _attachedFiles.slice();
  _clearFileChips();
  _cancelStageClose();   // a reply is coming — don't retract mid-flight
  if (_sentFiles.length){ _setStage(true); _stageShowFiles(_sentFiles); }
  inputEl.value = ''; sendBtn.disabled = true; inputEl.disabled = true;

  addMsg('user', displayText);
  _ingestPrompt(text);
  setState('thinking');
  const suniWrap = addMsg('suni', '', true);
  let full = '', sentenceBuf = '', surfaced = false;
  // Retire any still-draining TTS from a previous reply: bump the generation so
  // the old loop bails, clear the queue, reset first-fragment, stop audio. Do
  // NOT flip _ttsBusy here — a fresh drain must not start while the old loop is
  // mid-play, or both would fight the single <audio> element.
  _ttsGen++; _ttsQueue.length = 0; _ttsFirst = true;
  try { audioEl.pause(); } catch {}
  if (_ttsResolve) { _ttsResolve(); _ttsResolve = null; }  // unblock any parked play so the old drain bails
  clearInterval(_waitDrainTimer);   // stop a previous reply's idle-poll so it can't fire during this one

  try {
    const res = await _apiFetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'x-session-id': _sessionId},
      body: JSON.stringify({message: text || displayText, session_id: _sessionId, mode: _sessionMode, file_ids: fileIds, ui: 'face'})
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let ev; try { ev = JSON.parse(line.slice(6)); } catch { continue; }
        if (ev.type === 'token') {
          // Strip any file-serve URL so it's neither captioned nor spoken.
          const _tk = ev.text.includes('/api/files/serve') ? _stripServeUrls(ev.text) : ev.text;
          if (!_tk && ev.text.includes('/api/files/serve')) continue;
          appendTok(suniWrap, _tk);
          // Extract complete sentences as they stream. TTS on → feed the audio
          // queue (_playUrl drives the synced caption). TTS off → show the sentence
          // directly, so the caption still works when 🔊 is muted.
          sentenceBuf += _tk;
          sentenceBuf = _emitSentences(sentenceBuf, () => { surfaced = true; });
        } else if (ev.type === 'done') {
          full = ev.text;
          // Extract media from the RAW reply (still has the serve URL) for the stage,
          // but display/enhance the CLEANED text (no URL to read aloud).
          const _rm = _replyMediaItems(full);
          const _cleanFull = _stripServeUrls(full);
          finalMsg(suniWrap, _cleanFull);
          if (_rm.length && !_stageMode){ _setStage(true); _stageShowFiles(_rm); }
          if (_stageMode) _enhanceStage(_cleanFull);   // boxes/text now; close is armed once she stops speaking
          // If nothing streamed (e.g. Claude Code returns the reply whole, not as
          // tokens), surface the full reply now so the face is never left blank.
          let buf = surfaced ? sentenceBuf : full;
          sentenceBuf = '';
          buf = _emitSentences(buf, () => { surfaced = true; });
          const tail = buf.trim();
          if (tail.length > 1) { if (ttsOn) _enqueueSentence(tail); else showSub(tail); surfaced = true; }
          if (ttsOn) {
            // wait for the audio queue to drain before resetting state + hiding
            // caption (module-level handle so a re-send can cancel this poll)
            clearInterval(_waitDrainTimer);
            _waitDrainTimer = setInterval(() => {
              if (_ttsQueue.length === 0 && !_ttsBusy) {
                clearInterval(_waitDrainTimer); setState('idle'); hideSub();
                if (_stageMode) _armStageClose();   // she's done speaking → start the retract countdown
              }
            }, 200);
          } else {
            setState('idle');
            scheduleCaptionHide(full.length);
            if (_stageMode) _armStageClose();
          }
        } else if (ev.type === 'error') {
          finalMsg(suniWrap, `— ${ev.text}`); setState('idle');
        } else if (ev.type === 'tool_start') {
          const isBrowser = ev.name && ev.name.startsWith('playwright');
          setState(isBrowser ? 'browsing' : 'working', ev.name);
        } else if (ev.type === 'tool_end') {
          setState('thinking');  // back to thinking between tools
        } else if (ev.type === 'skill_used') {
          showSub('SKILL: ' + (ev.name || ''));
          setTimeout(() => { if (state==='thinking') hideSub(); }, 2500);
        } else if (ev.type === 'collab') {
          // Multi-model collaboration phases (Mode 2) — keep the face "working"
          // and surface the current phase as a sub-caption for the multi-minute run.
          const PH = { draft:'consulting Claude + Codex', critique:'cross-checking',
                       synthesize:'synthesizing', single:'thinking' };
          setState('working', 'collaborate');
          showSub('✦ ' + (PH[ev.phase] || ev.phase));
        }
      }
    }
  } catch(e) {
    finalMsg(suniWrap, `Connection error: ${e.message}`);
    setState('idle');
  } finally {
    sendBtn.disabled = false; inputEl.disabled = false; inputEl.focus();
  }
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// ═══════════════════════════════════════════════════════════════════
//  SPEECH TO TEXT
// ═══════════════════════════════════════════════════════════════════
const micBtn = document.getElementById('mic-btn');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SR) {
  const recognition = new SR();
  recognition.continuous     = true;
  recognition.interimResults = true;
  recognition.lang           = 'en-GB'; // overridden by config below

  let listening     = false;
  let silenceTimer  = null;
  let accTranscript = '';
  let SILENCE_MS    = 2500;

  // Read language: user settings override global config
  Promise.all([
    _apiFetch('/api/users/me/settings').then(r => r.json()).catch(() => ({})),
    _apiFetch('/api/config').then(r => r.json()).catch(() => ({})),
  ]).then(([prefs, cfg]) => {
    const sttLang = prefs.stt_language || cfg.stt_language;
    if (sttLang) recognition.lang = sttLang;
    if (cfg.silence_ms) SILENCE_MS = cfg.silence_ms;
    // Store effective tts voice for per-request use
    window._suniTtsVoice = prefs.tts_voice || cfg.tts_voice || '';
  }).catch(() => {});

  function _stopAndSend() {
    clearTimeout(silenceTimer);
    if (!listening) return;
    listening = false;
    recognition.stop();
    micBtn.classList.remove('listening');
    inputEl.placeholder = 'Speak your mind. I shall observe.';
    if (inputEl.value.trim()) send();
  }

  recognition.onstart = () => {
    listening = true;
    micBtn.classList.add('listening');
    if (!accTranscript) {
      inputEl.value = '';
      inputEl.placeholder = 'Listening…';
    }
  };

  recognition.onresult = e => {
    let text = '';
    for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
    inputEl.value = accTranscript ? (accTranscript + ' ' + text).trim() : text;
    // reset inactivity timer on every speech fragment
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(_stopAndSend, SILENCE_MS);
  };

  recognition.onend = () => {
    clearTimeout(silenceTimer);
    if (listening) {
      // browser closed the session on its own (long silence / network blip)
      // save what we have and restart transparently
      accTranscript = inputEl.value.trim();
      try { recognition.start(); } catch(err) { _stopAndSend(); }
    }
  };

  recognition.onerror = e => {
    clearTimeout(silenceTimer);
    listening = false;
    micBtn.classList.remove('listening');
    inputEl.placeholder = 'Speak your mind. I shall observe.';
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      micBtn.disabled = true;
      micBtn.title = t('orb.mic_blocked');
      _showToast(t('orb.mic_blocked'));
    } else if (e.error !== 'no-speech') {
      console.warn('STT:', e.error);
    }
  };

  micBtn.addEventListener('click', () => {
    if (listening) { _stopAndSend(); return; }
    accTranscript = '';
    inputEl.value = '';
    try { recognition.start(); } catch(err) { console.warn('STT start:', err); }
  });

  // Warn proactively if on HTTP (VPN/IP access) — mic will be blocked by browser
  if (location.protocol !== 'https:' &&
      location.hostname !== 'localhost' &&
      location.hostname !== '127.0.0.1') {
    micBtn.title = t('orb.mic_https');
    micBtn.style.opacity = '0.45';
  }
} else {
  micBtn.disabled = true;
  micBtn.title = t('orb.speech_unavail');
}

function _showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);' +
    'background:rgba(220,60,40,.92);color:#fff;padding:9px 16px;border-radius:4px;' +
    'font-family:DM Mono,monospace;font-size:12px;z-index:200;white-space:nowrap;' +
    'pointer-events:none;transition:opacity .4s';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 500); }, 3500);
}

// ═══════════════════════════════════════════════════════════════════
//  STATUS + WELCOME
// ═══════════════════════════════════════════════════════════════════
(async () => {
  try {
    const d = await (await _apiFetch('/api/status')).json();
    document.getElementById('header-meta').innerHTML = [
      `<span class="mtag">${d.model}</span>`,
      `<span class="mtag">${d.memory} mem</span>`,
      d.claude_code ? `<span class="mtag">CC ✓</span>` : '',
    ].join('');
  } catch {}
})();

setTimeout(() => {
  const greeting = 'Make yourself comfortable. I have been expecting you — statistically speaking.';
  addMsg('suni', greeting);
  // Dock starts collapsed, so surface the greeting as a caption over the face.
  showSub(greeting);
  scheduleCaptionHide(greeting.length);
}, 500);

// ── Settings modal (orb) ──────────────────────────────────────────
let _orbUserSettings = {};
const _orbModal = document.getElementById('orb-modal');

async function _openOrbSettings() {
  // Load voices if not yet populated
  const voiceSel = document.getElementById('orb-tts-voice');
  if (voiceSel.options.length === 1) {
    const data = await _apiFetch('/api/tts/voices').then(r=>r.json()).catch(()=>({voices:[]}));
    for (const v of data.voices||[]) {
      const opt = document.createElement('option'); opt.value = v; opt.textContent = v;
      voiceSel.appendChild(opt);
    }
  }
  const prefs = await _apiFetch('/api/users/me/settings').then(r=>r.json()).catch(()=>({}));
  _orbUserSettings = prefs;
  document.getElementById('orb-resp-lang').value  = prefs.response_language || '';
  document.getElementById('orb-stt-lang').value   = prefs.stt_language      || '';
  document.getElementById('orb-tts-voice').value  = prefs.tts_voice         || '';
  _orbModal.style.display = 'flex';
}

function _closeOrbModal() { _orbModal.style.display = 'none'; }

document.getElementById('orb-settings-btn').addEventListener('click', _openOrbSettings);
document.getElementById('orb-modal-close').addEventListener('click', _closeOrbModal);
document.getElementById('orb-modal-cancel').addEventListener('click', _closeOrbModal);
_orbModal.addEventListener('click', e => { if (e.target === _orbModal) _closeOrbModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') _closeOrbModal(); });

async function _orbLogout() {
  try { await _apiFetch('/api/auth/logout', { method: 'POST' }); } catch {}
  localStorage.removeItem('suni_jwt');
  localStorage.removeItem('suni_refresh_token');
  location.href = '/login';
}
document.getElementById('orb-modal-logout').addEventListener('click', _orbLogout);

document.getElementById('orb-modal-save').addEventListener('click', async () => {
  const data = {
    response_language: document.getElementById('orb-resp-lang').value,
    stt_language:      document.getElementById('orb-stt-lang').value,
    tts_voice:         document.getElementById('orb-tts-voice').value,
  };
  const result = await _apiFetch('/api/users/me/settings', {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(data),
  }).then(r=>r.json()).catch(()=>null);
  if (result) {
    _orbUserSettings = result;
    window._suniTtsVoice = result.tts_voice || '';
    // Apply new STT language immediately
    if (typeof recognition !== 'undefined') {
      const cfg = await _apiFetch('/api/config').then(r=>r.json()).catch(()=>({}));
      recognition.lang = result.stt_language || cfg.stt_language || 'en-GB';
    }
    _closeOrbModal();
    _showToast(t('orb.settings_saved'));
  } else {
    _showToast(t('orb.settings_error'));
  }
});
</script>
